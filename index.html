<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Number Quiz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            background-color: rgba(255, 255, 255, 0.95);
            width: 600px;
            height: 600px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        #score-display {
            font-size: 1.2rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            background: #e3f2fd;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #bbdefb;
        }

        .question-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        #tamil-word {
            font-size: 2.2rem;
            color: #1a237e;
            margin: 10px 0;
            font-weight: bold;
            word-break: break-word;
            line-height: 1.3;
            text-align: center;
        }

        #phonetic {
            font-size: 1.3rem;
            color: #5c6bc0;
            margin-bottom: 20px;
            font-style: italic;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-top: auto;
        }

        .option-btn {
            background: white;
            border: 2px solid #3f51b5;
            border-radius: 12px;
            padding: 18px 10px;
            font-size: 1.5rem;
            color: #3f51b5;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e8eaf6;
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .correct {
            background-color: #4caf50 !important;
            color: white !important;
            border-color: #388e3c !important;
        }

        .wrong {
            background-color: #f44336 !important;
            color: white !important;
            border-color: #d32f2f !important;
        }

        .restart-btn {
            background: #1a237e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }
        
        .restart-btn:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>

    <div class="game-container" id="game-card">
        <div id="score-display">Score: <span id="score">0</span></div>
        
        <div class="question-box">
            <div id="tamil-word">Loading...</div>
            <div id="phonetic">Loading...</div>
        </div>

        <div class="options-grid" id="options-container">
            <!-- Dynamic Buttons -->
        </div>
    </div>

    <script>
         const numbers = [
            { tamil: "இருபதியோனு", phonetic: "Irubathionnu", value: 21 },
            { tamil: "இருபதிரேண்டு", phonetic: "Irubathi rendu", value: 22 },
            { tamil: "இருபதிமுனு", phonetic: "Irubathi moonu", value: 23 },
            { tamil: "இருபதினாலு", phonetic: "Irubathi naalu", value: 24 },
            { tamil: "இருபதியாஞ்சு", phonetic: "Irubathi anju", value: 25 },
            { tamil: "இருபத்தியாறு", phonetic: "Irubathi aaru", value: 26 },
            { tamil: "இருபதிஏழு", phonetic: "Irubathi ezhu", value: 27 },
            { tamil: "இருபதிஎட்டு", phonetic: "Irubathi ettu", value: 28 },
            { tamil: "இருபத்தொன்பது ", phonetic: "Irubathi onbadhu", value: 29 },
            { tamil: "முப்பது", phonetic: "Mupathu", value: 30 },
            { tamil: "முபத்தோன்னு", phonetic: "Mubathonnu", value: 31 },
            { tamil: "நாற்பது", phonetic: "Narpathu", value: 40 },
            { tamil: "நாபத்தியோன்னு", phonetic: "Naapathionnu", value: 41 },
            { tamil: "ஐம்பது", phonetic: "Aimpathu", value: 50 },
            { tamil: "ஐம்பதிரெண்டு", phonetic: "Aimpathi rendu", value: 52 },
            { tamil: "அறுபது", phonetic:"Arupathu", value: 60 },
            { tamil: "அருபதிமூணு", phonetic: "Arupathi moonu", value: 63 },
            { tamil: "எழுபது", phonetic:"Ezhupathu", value: 70 },
            { tamil: "எழுபதி நலு", phonetic: "Ezhupathi naalu", value: 74 },
            { tamil: "எண்பது", phonetic:"Enpathu", value: 80 },
            { tamil: "என்பதி அஞ்சு", phonetic: "Enpathi Anju", value: 85 },
            { tamil: "தொண்ணூறு", phonetic:"Thonnooru", value: 90 },
            { tamil: "தொண்ணூதிஆறு", phonetic: "Thonnoothi aaru", value: 96 },
            { tamil: "நூறு", phonetic:"Nooru", value: 100 },
            { tamil: "நூற்றி ஏழு", phonetic: "Nootri ezhu", value: 107 },
            { tamil: "தொள்ளாயிரம்", phonetic:"Thollayiram", value: 900 },
            { tamil: "தொள்ளாயிரதிஎட்டு", phonetic: "Thollayirathi ettu", value: 908 },
            { tamil: "தொள்ளாயிரதிதொண்ணூறுதிஎட்டு", phonetic: "Thollayirathi thonnooruthi ettu", value: 998 },
            { tamil: "ஆயிரம்", phonetic:"Aayiram", value: 1000 },
            { tamil: "ஆயிரதிதொள்ளாயிரதிதொண்ணூறுதிஎட்டு", phonetic:"Aayirathi thollayirathi thonnooruthi ettu", value: 1998 }
        ];

        let score = 0;
        let currentIndex = 0;
        let shuffledQuestions = [];

        function initGame() {
            score = 0;
            currentIndex = 0;
            document.getElementById('score').innerText = score;
            // Shuffle dataset fully
            shuffledQuestions = [...numbers].sort(() => Math.random() - 0.5);
            nextQuestion();
        }

        function generateDistractors(correctVal) {
            let distractors = new Set([correctVal]);
            
            // Tailor choices relative to scale of the original number
            while(distractors.size < 4) {
                let offset;
                if (correctVal <= 40) {
                    offset = Math.floor(Math.random() * 20) - 10; // +/- 10
                } else if (correctVal <= 100) {
                    offset = Math.floor(Math.random() * 30) - 15; // +/- 15
                } else {
                    offset = Math.floor(Math.random() * 200) - 100; // +/- 100 for big numbers
                }
                
                let fakeVal = correctVal + offset;
                if(fakeVal > 0 && fakeVal !== correctVal) {
                    distractors.add(fakeVal);
                }
            }
            return Array.from(distractors);
        }

        function nextQuestion() {
            if (currentIndex >= shuffledQuestions.length) {
                showGameOver();
                return;
            }

            const currentNumber = shuffledQuestions[currentIndex];
            
            document.getElementById('tamil-word').innerText = currentNumber.tamil;
            document.getElementById('phonetic').innerText = currentNumber.phonetic;
            
            // Fetch relevant options
            let options = generateDistractors(currentNumber.value);
            options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, currentNumber.value);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, button, correctAnswer) {
            const buttons = document.querySelectorAll('.option-btn');
            // Disable buttons immediately so player cannot multi-click
            buttons.forEach(b => b.disabled = true);

            if (selected === correctAnswer) {
                button.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
            } else {
                button.classList.add('wrong');
                buttons.forEach(b => {
                    if(parseInt(b.innerText) === correctAnswer) b.classList.add('correct');
                });
            }

            // Progression index increments regardless of right/wrong condition
            currentIndex++;
            setTimeout(nextQuestion, 1500);
        }

        function showGameOver() {
            const container = document.getElementById('game-card');
            container.innerHTML = `
                <div id="score-display">Final Score: ${score} / ${shuffledQuestions.length * 10}</div>
                <h1 style="color: #1a237e; margin-top: 40px; font-size: 2.5rem;">Nandri!</h1>
                <p style="color: #555; font-size: 1.1rem;">You finished all ${shuffledQuestions.length} numbers.</p>
                <button class="restart-btn" onclick="location.reload()">Play Again</button>
            `;
        }

        initGame();
    </script>
</body>
</html>
